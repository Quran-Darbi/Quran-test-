name: Build quiz pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Scripts/quran-uthmani.txt'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate data
        run: node tools/validate.js
      - name: Build pages
        run: node tools/build.js
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "build: regenerate quiz pages from src/"
          git push
