name: unzip
on:
  push:
    paths: ['darbi_main_upload.zip']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unzip-deploy
  cancel-in-progress: false
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ ! -f darbi_main_upload.zip ]; then echo "no zip, nothing to do"; exit 0; fi
          unzip -oq darbi_main_upload.zip
          rm darbi_main_upload.zip
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "deploy new structure" || true
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          [ "$ok" = 1 ]
