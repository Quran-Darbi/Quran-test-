<title>اختبار حفظ سورة البقرة — الصفحة 5</title>
<style>
  :root {
    --bg: #f0f4f0;
    --text: #2d4a2d;
    --card: #fff;
    --border: #c8d9c0;
    --gold: #c4a84a;
    --text-soft: #7a9a7a;
    --accent: #4a7c4a;
    --surface2: #f4f8f2;
    --surface-hover: #e0edd8;
    --correct-bg: #d4edda;
    --correct-text: #1a5c1a;
    --wrong-bg: #f8d7da;
    --wrong-text: #7a1a1a;
    --wrong-border: #c0392b;
    --surface3: #f8fbf6;
    --text-faint: #6a8a6a;
    --accent-light: #9db89d;
    --accent-dark: #3a6a3a;
    --hint-bg: #f0f5ec;
    --hint-border: #9bbf8a;
    --hint-btn-bg: #fff7e6;
    --hint-btn-text: #9a7b1f;
    --hint-btn-border: #e8d28a;
  }
  html[data-theme="dark"] {
    --bg: #1c2420;
    --text: #d9ecd9;
    --card: #232f29;
    --border: #3a4d40;
    --gold: #d9b96a;
    --text-soft: #8fae8f;
    --accent: #5fae5f;
    --surface2: #2a3830;
    --surface-hover: #324438;
    --correct-bg: #234a30;
    --correct-text: #8fe0a0;
    --wrong-bg: #4a2328;
    --wrong-text: #e89a9a;
    --wrong-border: #c0392b;
    --surface3: #1f2a24;
    --text-faint: #9bb89b;
    --accent-light: #4a6a4a;
    --accent-dark: #7fcf7f;
    --hint-bg: #2a3424;
    --hint-border: #5a7a4a;
    --hint-btn-bg: #3a3324;
    --hint-btn-text: #d9b96a;
    --hint-btn-border: #5a4a2a;
  }
  body { transition: background-color .3s, color .3s; }
  .info-card, .level-card, .quiz-area, .result-area { transition: background-color .3s, border-color .3s; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Amiri','Scheherazade New','Traditional Arabic',serif; background:var(--bg); color:var(--text); min-height:100vh; direction:rtl; }
  .top-bar { background:var(--bg); padding:12px 20px; }
  .back-btn { background:none; border:none; color:var(--accent); font-size:18px; cursor:pointer; text-decoration:none; font-family:inherit; }
  .info-card { margin:0 16px 16px; background:var(--card); border:1.5px solid var(--border); border-radius:18px; padding:22px 20px 18px; text-align:center; position:relative; }
  .info-card::before,.info-card::after{content:'✦';color:var(--gold);font-size:20px;position:absolute;top:16px;}
  .info-card::before{right:18px;}.info-card::after{left:18px;}
  .surah-title{font-size:28px;font-weight:700;color:var(--text);margin-bottom:4px;}
  .ayat-range{font-size:15px;color:var(--accent);margin-bottom:4px;}
  .page-info{font-size:14px;color:var(--text-soft);margin-bottom:14px;}
  .stats-row{display:flex;gap:10px;justify-content:center;}
  .stat-badge{background:var(--accent);color:var(--card);border-radius:12px;padding:8px 18px;font-size:14px;text-align:center;min-width:80px;line-height:1.4;}
  .level-card{margin:0 16px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:24px 20px 20px;text-align:center;}
  .level-title{font-size:22px;color:var(--text);margin-bottom:6px;}
  .level-sub{font-size:14px;color:var(--text-soft);margin-bottom:20px;}
  .levels-grid{display:flex;gap:10px;justify-content:center;margin-bottom:20px;}
  .level-btn{flex:1;max-width:100px;background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;padding:16px 8px;cursor:pointer;transition:all .2s;font-family:inherit;color:var(--text);}
  .level-btn:hover,.level-btn.active{background:var(--surface-hover);border-color:var(--accent);}
  .level-icon{font-size:28px;display:block;margin-bottom:6px;}
  .level-name{font-weight:700;font-size:15px;display:block;margin-bottom:6px;}
  .level-desc{font-size:12px;color:var(--text-faint);line-height:1.5;}
  .start-btn{width:100%;max-width:260px;background:var(--accent-light);color:var(--card);border:none;border-radius:14px;padding:14px 20px;font-size:17px;font-family:inherit;cursor:pointer;}
  .start-btn.ready{background:var(--accent);}
  .quiz-area{margin:0 16px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:24px 20px;display:none;}
  .q-number{font-size:13px;color:var(--text-soft);margin-bottom:10px;text-align:center;}
  .q-text{font-size:19px;line-height:2;color:var(--text);text-align:center;margin-bottom:20px;background:var(--surface3);border-radius:12px;padding:16px;}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice-btn{background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;font-size:17px;font-family:inherit;color:var(--text);cursor:pointer;text-align:right;transition:all .15s;line-height:1.8;}
  .choice-btn:hover:not(:disabled){background:var(--surface-hover);border-color:var(--accent);}
  .choice-btn.correct{background:var(--correct-bg);border-color:var(--accent);color:var(--correct-text);}
  .choice-btn.wrong{background:var(--wrong-bg);border-color:var(--wrong-border);color:var(--wrong-text);}
  .answer-input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;font-size:18px;font-family:inherit;color:var(--text);background:var(--surface3);outline:none;resize:vertical;min-height:70px;text-align:right;direction:rtl;}
  .answer-input:focus{border-color:var(--accent);}
  .submit-btn{margin-top:14px;width:100%;background:var(--accent);color:var(--card);border:none;border-radius:12px;padding:13px;font-size:17px;font-family:inherit;cursor:pointer;}
  .feedback{margin-top:14px;padding:14px;border-radius:12px;font-size:16px;line-height:1.9;display:none;text-align:center;}
  .feedback.correct{background:var(--correct-bg);color:var(--correct-text);}
  .feedback.wrong{background:var(--wrong-bg);color:var(--wrong-text);}
  .next-btn{margin-top:12px;width:100%;background:var(--accent);color:var(--card);border:none;border-radius:12px;padding:13px;font-size:17px;font-family:inherit;cursor:pointer;display:none;}
  .result-area{margin:0 16px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:30px 20px;text-align:center;display:none;}
  .result-icon{font-size:52px;margin-bottom:12px;}
  .result-title{font-size:24px;font-weight:700;color:var(--text);margin-bottom:8px;}
  .result-score{font-size:18px;color:var(--accent);margin-bottom:20px;}
  .result-msg{font-size:16px;color:var(--text-faint);margin-bottom:24px;}
  .retry-btn{background:var(--accent);color:var(--card);border:none;border-radius:12px;padding:13px 30px;font-size:17px;font-family:inherit;cursor:pointer;margin:5px;}
  .home-link{display:inline-block;background:var(--surface2);color:var(--accent);border:1.5px solid var(--border);border-radius:12px;padding:12px 28px;font-size:17px;font-family:inherit;text-decoration:none;margin:5px;}
  .progress-bar-wrap{background:var(--surface-hover);border-radius:8px;height:8px;margin-bottom:18px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--accent);border-radius:8px;transition:width .3s;}
  .translate-bar{position:fixed;bottom:20px;left:16px;background:var(--accent);color:var(--card);border-radius:50px;padding:10px 16px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.15);}
  .skip-btn { margin-top:12px; width:100%; background:var(--surface2); color:var(--accent); border:1.5px solid var(--border); border-radius:12px; padding:14px 18px; font-size:17px; font-family:inherit; cursor:pointer; display:none; text-align:center; }
  .skip-btn:hover { background:var(--surface-hover); }

  .q-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--border); transition: all .2s; }
  .q-dot.current { width:15px; height:15px; box-shadow:0 0 0 3px var(--surface-hover); background:var(--accent); }
  .q-dot.correct { background: var(--accent); }
  .q-dot.wrong   { background: var(--wrong-border); }
  .confetti-piece { position: absolute; top: -20px; width: 9px; height: 14px; opacity: 0.9; animation: confetti-fall linear forwards; }
  @keyframes confetti-fall { to { transform: translateY(110vh) rotate(540deg); opacity: 0.3; } }
.level-return-btn{display:block;width:100%;margin-top:14px;padding:11px;background:var(--surface2);color:var(--text-soft);border:1.5px solid var(--border);border-radius:12px;font-size:15px;font-family:inherit;cursor:pointer;transition:all .2s;text-align:center;}
.level-return-btn:hover{background:var(--surface-hover);border-color:var(--accent);color:var(--accent);}
.rec-transcript{background:var(--surface3);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.9;color:var(--text);direction:rtl;text-align:right;margin-bottom:10px;display:none;min-height:60px;white-space:pre-wrap;}.rec-word{display:inline-block;margin:2px 1px;padding:2px 6px;border-radius:5px;cursor:pointer;}.rec-word:hover{opacity:0.8;text-decoration:line-through;}
</style>

<div class="info-card">
  <div class="surah-title">سورة البقرة</div>

    <div class="stat-badge" id="qnum-badge">السؤال 1 /<br><span id="total-q">12</span></div>

    <button onclick="dismissResume()" style="flex:1; background:var(--surface3); color:var(--text-soft); border:1.5px solid var(--border); border-radius:10px; padding:10px; font-family:inherit; font-size:15px; cursor:pointer;">البدء من جديد</button>

<a href="albaqara_p6.html" id="next-page-btn" style="display:block;text-align:center;text-decoration:none;margin-top:10px;padding:12px;border-radius:12px;background:var(--surface2);color:var(--accent);border:1.5px solid var(--border);font-family:inherit;font-size:15px;">⏭️ التالي</a>

  <button class="level-return-btn" onclick="returnToLevels()">&#x1F504; &#x627;&#x62E;&#x62A;&#x631; &#x645;&#x633;&#x62A;&#x648;&#x649; &#x622;&#x62E;&#x631;</button>

<script>
const EASY_Q=[
  {q:"«وَبَشِّرِ الَّذِينَ ءَامَنُوا وَعَمِلُوا الصَّٰلِحَٰتِ أَنَّ لَهُمْ جَنَّٰتٍ تَجْرِي مِن تَحْتِهَا _____»",choices:["الْأَنْهَٰرُ","الْعُيُونُ","الْأَمْوَاهُ"],answer:0},
  {q:"«كُلَّمَا رُزِقُوا مِنْهَا مِن ثَمَرَةٍ رِّزْقًا قَالُوا هَٰذَا الَّذِي رُزِقْنَا مِن _____»",choices:["قَبْلُ","أَمَامُ","أَوَّلُ"],answer:0},
  {q:"«وَأُتُوا بِهِ _____»",choices:["مُتَشَٰبِهًا","مُتَمَاثِلًا","مُتَجَانِسًا"],answer:0},
  {q:"«وَلَهُمْ فِيهَآ أَزْوَٰجٌ _____»",choices:["مُطَهَّرَةٌ","طَاهِرَةٌ","مُكَرَّمَةٌ"],answer:0},
  {q:"«إِنَّ اللَّهَ لَا يَسْتَحْيِي أَن يَضْرِبَ مَثَلًا مَّا بَعُوضَةً _____»",choices:["فَمَا فَوْقَهَا","فَمَا دُونَهَا","فَمَا تَحْتَهَا"],answer:0},
  {q:"«يُضِلُّ بِهِ كَثِيرًا وَيَهْدِي بِهِ _____»",choices:["كَثِيرًا","كَبِيرًا","عَظِيمًا"],answer:0},
  {q:"«وَمَا يُضِلُّ بِهِ إِلَّا _____»",choices:["الْفَٰسِقِينَ","الْكَافِرِينَ","الظَّالِمِينَ"],answer:0},
  {q:"«الَّذِينَ يَنقُضُونَ عَهْدَ اللَّهِ مِن بَعْدِ _____»",choices:["مِيثَٰقِهِ","عَهْدِهِ","أَمْرِهِ"],answer:0},
  {q:"«وَيُفْسِدُونَ فِي الْأَرْضِ أُولَٰئِكَ هُمُ _____»",choices:["الْخَٰسِرُونَ","الضَّالُّونَ","الْفَاسِقُونَ"],answer:0},
  {q:"«كَيْفَ تَكْفُرُونَ بِاللَّهِ وَكُنتُمْ أَمْوَٰتًا فَـ_____»",choices:["أَحْيَٰكُمْ","رَزَقَكُمْ","خَلَقَكُمْ"],answer:0},
  {q:"«ثُمَّ يُمِيتُكُمْ ثُمَّ _____ ثُمَّ إِلَيْهِ تُرْجَعُونَ»",choices:["يُحْيِيكُمْ","يَبْعَثُكُمْ","يُنْشِئُكُمْ"],answer:0},
  {q:"«فَسَوَّاهُنَّ سَبْعَ سَمَٰوَٰتٍ وَهُوَ بِكُلِّ شَيْءٍ _____»",choices:["عَلِيمٌ","قَدِيرٌ","خَبِيرٌ"],answer:0}
];

const MEDIUM_Q = [
  {q:"«وَبَشِّرِ الَّذِينَ ءَامَنُوا وَعَمِلُوا _____»",answer:"الصَّٰلِحَٰتِ"},
  {q:"«أَنَّ لَهُمْ _____ تَجْرِي مِن تَحْتِهَا الْأَنْهَٰرُ»",answer:"جَنَّٰتٍ"},
  {q:"«وَلَهُمْ فِيهَآ أَزْوَٰجٌ مُطَهَّرَةٌ وَهُمْ فِيهَا _____»",answer:"خَٰلِدُونَ"},
  {q:"«إِنَّ اللَّهَ لَا يَسْتَحْيِي أَن _____ مَثَلًا مَّا بَعُوضَةً»",answer:"يَضْرِبَ"},
  {q:"«فَأَمَّا الَّذِينَ ءَامَنُوا فَيَعْلَمُونَ أَنَّهُ الْحَقُّ مِن _____»",answer:"رَّبِّهِمْ"},
  {q:"«وَأَمَّا الَّذِينَ _____ فَيَقُولُونَ مَاذَآ أَرَادَ اللَّهُ بِهَٰذَا مَثَلًا»",answer:"كَفَرُوا"},
  {q:"«الَّذِينَ يَنقُضُونَ _____ اللَّهِ مِن بَعْدِ مِيثَٰقِهِ»",answer:"عَهْدَ"},
  {q:"«وَيَقْطَعُونَ مَآ أَمَرَ اللَّهُ بِهِ أَن _____»",answer:"يُوصَلَ"},

let currentLevel=null,questions=[],qIndex=0,correctCount=0,wrongCount=0;
let statuses = [];
let wrongIndices = [];
const PAGE_ID = 'p5';

function toArabicNum(n){return n;}
function selectLevel(lvl){currentLevel=lvl;document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+lvl).classList.add('active');document.getElementById('start-btn').classList.add('ready');const t={easy:'12',medium:'12',hard:'6'};document.getElementById('total-q').textContent=t[lvl];}
function updateBadges(){document.getElementById('qnum-badge').innerHTML=`السؤال ${toArabicNum(qIndex+1)} /<br>${toArabicNum(questions.length)}`;document.getElementById('wrong-badge').innerHTML=`${toArabicNum(wrongCount)} ✗<br>خطأ`;document.getElementById('correct-badge').innerHTML=`${toArabicNum(correctCount)} ✓<br>صحيح`;}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function startQuiz(){if(!currentLevel)return;if(currentLevel==='easy')questions=[...EASY_Q];if(currentLevel==='medium')questions=[...MEDIUM_Q];if(currentLevel==='hard')questions=[...HARD_Q];qIndex=correctCount=wrongCount=0;statuses = questions.map(() => 'pending'); wrongIndices = []; var rb=document.getElementById('resume-banner'); if(rb) rb.style.display='none'; document.getElementById('level-card').style.display='none';document.getElementById('quiz-area').style.display='block';showQuestion();}
function showQuestion(){const q=questions[qIndex];updateBadges();document.getElementById('progress-fill').style.width=((qIndex)/questions.length*100)+'%';document.getElementById('q-number').textContent=`السؤال ${toArabicNum(qIndex+1)} من ${toArabicNum(questions.length)}`;document.getElementById('q-text').textContent=q.q;document.getElementById('feedback').style.display='none';document.getElementById('next-btn').style.display='none';document.getElementById('skip-btn').style.display='block';
  document.getElementById('skip-btn').style.display='block';renderDotProgress();
  const zone=document.getElementById('answer-zone');zone.innerHTML='';if(currentLevel==='easy'){const div=document.createElement('div');div.className='choices';shuffle(q.choices.map((c,i)=>({text:c,idx:i}))).forEach(opt=>{const btn=document.createElement('button');btn.className='choice-btn';btn.textContent=opt.text;btn.onclick=()=>checkMCQ(opt.idx,q.answer,btn);div.appendChild(btn);});zone.appendChild(div);
  } else {
    if (currentLevel === 'hard') {

      const modeRow = document.createElement('div');
      modeRow.style.cssText = 'display:flex;gap:10px;margin-bottom:12px;';
      const bVoice = document.createElement('button');
      bVoice.textContent = '🎤 تسجيل صوتي';
      bVoice.style.cssText = 'flex:1;padding:11px;border-radius:11px;font-size:15px;font-family:inherit;cursor:pointer;background:var(--accent);color:#fff;border:1.5px solid var(--accent);';
      const bText = document.createElement('button');
      bText.textContent = '⌨️ كتابة';
      bText.style.cssText = 'flex:1;padding:11px;border-radius:11px;font-size:15px;font-family:inherit;cursor:pointer;background:var(--surface2);color:var(--text);border:1.5px solid var(--border);';
      modeRow.appendChild(bVoice); modeRow.appendChild(bText);
      zone.appendChild(modeRow);

      const vZone = document.createElement('div'); zone.appendChild(vZone);
      const tZone = document.createElement('div'); tZone.style.display='none'; zone.appendChild(tZone);

      bVoice.onclick=()=>{ vZone.style.display=''; tZone.style.display='none'; bVoice.style.background='var(--accent)'; bVoice.style.color='#fff'; bVoice.style.borderColor='var(--accent)'; bText.style.background='var(--surface2)'; bText.style.color='var(--text)'; bText.style.borderColor='var(--border)'; };
      bText.onclick=()=>{ vZone.style.display='none'; tZone.style.display=''; bText.style.background='var(--accent)'; bText.style.color='#fff'; bText.style.borderColor='var(--accent)'; bVoice.style.background='var(--surface2)'; bVoice.style.color='var(--text)'; bVoice.style.borderColor='var(--border)'; };

      const recBtn=document.createElement('button');recBtn.className='rec-btn';
      recBtn.style.cssText='width:100%;padding:14px;border-radius:12px;font-size:16px;font-family:inherit;cursor:pointer;border:2px solid var(--border);background:var(--surface2);color:var(--text);margin-bottom:8px;';
      recBtn.textContent='🎤 اضغط للتسجيل';

      const txBox=document.createElement('div');txBox.className='rec-transcript';
      txBox.title='انقري على أي كلمة لحذفها';

      const clrBtn=document.createElement('button');
      clrBtn.style.cssText='width:100%;padding:9px;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;border:1.5px solid var(--wrong-border);background:var(--wrong-bg);color:var(--wrong-text);margin-bottom:8px;display:none;';
      clrBtn.textContent='🗑️ مسح الكل والبدء من جديد';

      const vSub=document.createElement('button');vSub.className='submit-btn';vSub.textContent='تحقق ✓';vSub.style.display='none';

      vZone.appendChild(recBtn);vZone.appendChild(txBox);vZone.appendChild(clrBtn);vZone.appendChild(vSub);

      let _rec=null,_recog=false,_words=[],_cur='';
      const _SpeechAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
      const _secure=location.protocol==='https:'||location.hostname==='localhost';

      function renderWords(){
        if(!_words.length&&!_cur){txBox.style.display='none';clrBtn.style.display='none';vSub.style.display='none';return;}
        txBox.style.display='block';
        txBox.innerHTML='';
        _words.forEach((w,i)=>{
          const span=document.createElement('span');span.className='rec-word';
          span.style.cssText='background:var(--surface-hover);border-radius:4px;padding:2px 5px;margin:2px;cursor:pointer;';
          span.textContent=w;span.title='انقري للحذف';
          span.onclick=()=>{_words.splice(i,1);renderWords();};
          txBox.appendChild(span);
        });
        if(_cur){
          const cur=document.createElement('span');cur.style.cssText='color:var(--text-soft);font-style:italic;';
          cur.textContent=' '+_cur;txBox.appendChild(cur);
        }
        clrBtn.style.display='block';
        vSub.style.display=_words.length?'block':'none';
      }

      function _setB(s){
        recBtn.disabled=false;
        if(s==='rec'){recBtn.textContent='⏸ إيقاف التسجيل';recBtn.style.background='#e74c3c';recBtn.style.color='#fff';recBtn.style.borderColor='#e74c3c';}
        else if(s==='pause'){recBtn.textContent='▶️ استمر في التسجيل';recBtn.style.background='#e67e22';recBtn.style.color='#fff';recBtn.style.borderColor='#e67e22';}
        else{recBtn.textContent='🎤 اضغط للتسجيل';recBtn.style.background='var(--surface2)';recBtn.style.color='var(--text)';recBtn.style.borderColor='var(--border)';}
      }

      function _mkRec(){
        const r=new _SpeechAPI();r.lang='ar-SA';r.continuous=true;r.interimResults=false;
        r.onstart=()=>{_recog=true;_cur='';_setB('rec');renderWords();};
        r.onresult=e=>{
          for(let i=e.resultIndex;i<e.results.length;i++){
            if(e.results[i].isFinal){
              const newWords=e.results[i][0].transcript.trim().split(/\s+/);
              _words=_words.concat(newWords);_cur='';
            }
          }
          renderWords();
        };
        r.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted'){_recog=false;_setB(_words.length?'pause':'idle');}};
        r.onend=()=>{_recog=false;if(_cur){_words=_words.concat(_cur.trim().split(/\s+/));_cur='';}renderWords();_setB(_words.length?'pause':'idle');};
        return r;
      }

      clrBtn.onclick=()=>{
        if(_recog){try{_rec.stop();}catch(e){}}
        _recog=false;_rec=null;
        _words=[];_cur='';
        txBox.innerHTML='';txBox.style.display='none';
        clrBtn.style.display='none';
        vSub.style.display='none';
        _setB('idle');
        recBtn.disabled=false;
      };

      vSub.onclick=()=>{
        const t=_words.join(' ').trim();if(!t)return;
        vSub.disabled=true;
        checkTextVal(q,t);
        setTimeout(()=>{
          recBtn.disabled=false;
          vSub.disabled=false;
        },300);
      };

      if(_SpeechAPI&&_secure){
        recBtn.onclick=()=>{
          if(_recog){_recog=false;try{_rec.stop();}catch(e){}_setB('pause');return;}
          _rec=_mkRec();
          try{_rec.start();}catch(e){_setB(_words.length?'pause':'idle');}
        };
      }else{
        recBtn.textContent=_secure?'⚠️ المتصفح لا يدعم التسجيل':'🔒 يعمل على الموقع الرسمي فقط';
        recBtn.disabled=true;recBtn.style.opacity='0.65';
      }

      const ta2=document.createElement('textarea'); ta2.className='answer-input'; ta2.placeholder='اكتب الآية كاملة...'; ta2.id='user-input'; tZone.appendChild(ta2);
      const tSub=document.createElement('button'); tSub.className='submit-btn'; tSub.textContent='تحقق ✓'; tSub.onclick=()=>checkText(q); tZone.appendChild(tSub);

      const hBox=document.createElement('div'); hBox.style.cssText='display:none;background:var(--hint-bg);border:1.5px dashed var(--hint-border);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:18px;color:var(--accent-dark);text-align:center;'; zone.appendChild(hBox);
      const hBtn=document.createElement('button'); hBtn.id='hint-btn'; hBtn.textContent='💡 مساعدة (أول 3 كلمات)'; hBtn.style.cssText='width:100%;background:var(--hint-btn-bg);color:var(--hint-btn-text);border:1.5px solid var(--hint-btn-border);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;cursor:pointer;margin-top:10px;'; hBtn.onclick=()=>{hBox.textContent=q.answer.split(' ').slice(0,3).join(' ')+' ...';hBox.style.display='block';hBtn.disabled=true;hBtn.style.opacity='0.5';}; zone.appendChild(hBtn);

    } else {
      const ta=document.createElement('textarea'); ta.className='answer-input'; ta.placeholder='اكتب الكلمة الناقصة...'; ta.id='user-input'; zone.appendChild(ta);
      const sub=document.createElement('button'); sub.className='submit-btn'; sub.textContent='تحقق ✓'; sub.onclick=()=>checkText(q); zone.appendChild(sub);
    }
  }
}

function normalize(str){
  if(!str)return'';
  return str
    .replace(/ي\u0653?ـ\u064E\u0654/g,'ي')
    .replace(/ـ\u064E\u0654/g,'ا')
    .replace(/ـ[\u064B-\u065F]*[\u0654\u0655]/g,'')
    .replace(/يٓ?ـَٔ/g,'ي').replace(/ـَٔ/g,'ا').replace(/ـ[ًٌٍَُِّْٕٖٜٟٓٔٗ٘ٙٚٛٝٞ]*[ٕٔ]/g,'').replace(/ـَٔ/g,'ا').replace(/ـ[ًٌٍَُِّْٕٖٜٟٓٔٗ٘ٙٚٛٝٞ]*[ٕٔ]/g,'').replace(/ـَٔ/g,'ا').replace(/ـ[ًٌٍَُِّْٕٖٜٟٓٔٗ٘ٙٚٛٝٞ]*[ٕٔ]/g,'').replace(/ـَٔ/g,'ا').replace(/ـ[ًٌٍَُِّْٕٖٜٟٓٔٗ٘ٙٚٛٝٞ]*[ٕٔ]/g,'').replace(/ـ/g,'')
    .replace(/[\u064B-\u065F\u0610-\u061A\u06D6-\u06DC\u06DF-\u06E4\u06E7\u06E8\u06EA-\u06ED]/g,'')
    .replace(/ها[ؤو]لاء|ها[ؤو]لا(?!\S)/g,'هالا').replace(/ه[ؤو]لاء|ه[ؤو]لا(?!\S)/g,'هالا')
    .replace(/وٱ(?!ل)/g,'و')
    .replace(/^وا(?=سجد|قترب|دخل|دعو|ذكر|رحم|ستغفر|ستغن|غفر|عف|نحر|تق|ختلاف|مر[أا]|تبع|سمع|ستكبر|ستعين|ركع|صبر|صل|جتنب|هبط|ستبشر|ستقم|ضرب|عتصم|ئتلف|بتغ|حذر)/g,'و')
    .replace(/وٰ(?=ة)/g,'ا').replace(/وٰ/g,'وا')
    .replace(/اٰ/g,'ا').replace(/يٰ/g,'يا')
    .replace(/نٰ/g,'نا')
    .replace(/ىٰ(?=\S)/g,'ا').replace(/ىٰ/g,'ي')
    .replace(/(.)ٰ/g,'$1ا')
    .replace(/هۥ/g,'ه').replace(/هۦ/g,'ه')
    .replace(/ۦ(?=\S)/g,'ي').replace(/ۦ/g,'').replace(/ۥ/g,'')
    .replace(/ه[ۥۦ]/g,'ه')
    .replace(/[ئؤ]/g,'ء').replace(/ء/g,'')
    .replace(/[آأإٱا]/g,'ا')
    .replace(/[ىی]/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/(.)\1+/g,'$1')
    .replace(/رحمان/g,'رحمن')
    .replace(/مولانا/g,'مولنا').replace(/يا ايها/g,'يايها').replace(/يا ايتها/g,'يايتها').replace(/الاه/g,'اله').replace(/ارايت/g,'اريت').replace(/نب/g,'مب').replace(/وا(?=\s|$)/g,'و').replace(/اولك/g,'اولاك').replace(/يا ?ايها/g,'يايها').replace(/يا ?ايتها/g,'يايتها')
    .replace(/الاه/g,'اله').replace(/ارايت/g,'اريت')
    .replace(/هاذا/g,'هذا').replace(/هاذه/g,'هذه').replace(/ذالك/g,'ذلك').replace(/لاكن/g,'لكن')
    .replace(/\s+/g,' ')
    .trim();
}

function wordDiff(userVal, correctAnswer) {
  const nm = s => normalize(s||'');
  const uWords = nm(userVal).split(' ');
  const cWords = correctAnswer.split(' ');
  let correct = 0;
  const html = cWords.map((word, i) => {
    const ok = nm(uWords[i]||'') === nm(word);
    if(ok) correct++;
    return ok
      ? '<span style="color:#155724;background:#c3e6cb;border-radius:5px;padding:2px 6px;margin:2px 1px;display:inline-block;font-weight:bold;">'+word+'</span>'
      : '<span style="color:#fff;background:#c0392b;border-radius:5px;padding:2px 6px;margin:2px 1px;display:inline-block;">'+word+'</span>';
  }).join(' ');
  return '<div style="margin-bottom:6px;font-size:13px;color:#666;">'+correct+' / '+cWords.length+' كلمة صحيحة</div>'
       + '<div style="font-size:18px;line-height:2.5;direction:rtl;text-align:right;color:#333;">'+html+'</div>';
}
function checkMCQ(chosen,correct,btn){document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);const fb=document.getElementById('feedback');if(chosen===correct){btn.classList.add('correct');correctCount++; statuses[qIndex]='correct';fb.className='feedback correct';fb.textContent='✓ أحسنت!';}else{btn.classList.add('wrong');wrongCount++; statuses[qIndex]='wrong'; wrongIndices.push(qIndex);document.querySelectorAll('.choice-btn').forEach(b=>{if(b.textContent===questions[qIndex].choices[correct])b.classList.add('correct');});fb.className='feedback wrong';fb.textContent=`✗ الإجابة الصحيحة: ${questions[qIndex].choices[correct]}`;}fb.style.display='block';updateBadges();renderDotProgress(); saveResumeState(); document.getElementById('next-btn').style.display='block'; document.getElementById('skip-btn').style.display='none';}
function checkTextVal(q, userVal) {
  if (!userVal) return;
  const fb = document.getElementById('feedback');
  const correct = normalize(q.answer);
  const user    = normalize(userVal);
  if (user === correct) {
    correctCount++; statuses[qIndex]='correct';
    fb.className = 'feedback correct';
    fb.innerHTML = '✓ أحسنت! إجابة صحيحة تماماً 🌟';
  } else {
    wrongCount++; statuses[qIndex]='wrong'; wrongIndices.push(qIndex);
    fb.className = 'feedback wrong';
    fb.innerHTML = '✗ الإجابة الصحيحة:<br><span style="font-size:18px;line-height:2.2;direction:rtl;display:block;text-align:right;">'+wordDiff(userVal,q.answer)+'</span>';
  }
  fb.style.display = 'block';
  updateBadges();
  renderDotProgress(); saveResumeState(); document.getElementById('next-btn').style.display = 'block'; document.getElementById('skip-btn').style.display = 'none';
}
function checkText(q) {
  const input = document.getElementById('user-input');
  const userVal = input.value.trim();
  if (!userVal) return;
  input.disabled = true;
  document.querySelectorAll('.submit-btn').forEach(b => b.disabled = true);
  checkTextVal(q, userVal);
}

function skipQuestion(){
  const q=questions[qIndex];
  const fb=document.getElementById('feedback');
  if(currentLevel==='easy'){
    document.querySelectorAll('.choice-btn').forEach(b=>{
      b.disabled=true;
      if(b.textContent===q.choices[q.answer]) b.classList.add('correct');
    });
    fb.className='feedback wrong';
    fb.innerHTML=`⬅ الإجابة الصحيحة: ${q.choices[q.answer]}`;
  } else {
    if(document.getElementById('user-input')) document.getElementById('user-input').disabled=true;
    document.querySelectorAll('.submit-btn').forEach(b=>b.disabled=true);
    fb.className='feedback wrong';
    fb.innerHTML=`⬅ الإجابة الصحيحة:<br><span style="font-size:18px;line-height:2">${q.answer}</span>`;
  }
  wrongCount++; statuses[qIndex]='wrong'; wrongIndices.push(qIndex);
  fb.style.display='block';
  updateBadges();
  document.getElementById('skip-btn').style.display='none';
  renderDotProgress(); saveResumeState(); document.getElementById('next-btn').style.display='block'; document.getElementById('skip-btn').style.display='none';
}
function nextQuestion(){qIndex++;if(qIndex>=questions.length)showResult();else showQuestion();}
function showResult(){document.getElementById('quiz-area').style.display='none';document.getElementById('result-area').style.display='block';try{localStorage.setItem('quranProgress_p5', JSON.stringify({pct: Math.round((correctCount/questions.length)*100), level: currentLevel, date: Date.now()}));}catch(e){}const pct=Math.round((correctCount/questions.length)*100);document.getElementById('result-score').textContent=`${toArabicNum(correctCount)} / ${toArabicNum(questions.length)} — ${toArabicNum(pct)}%`;let icon,title,msg;if(pct===100){icon='🌟';title='ممتاز! حفظ مثالي';msg='ما شاء الله! أتقنت الصفحة بالكامل';}else if(pct>=80){icon='✨';title='أحسنت!';msg='نتيجة رائعة، استمر في المراجعة';}else if(pct>=60){icon='📖';title='جيد';msg='راجع الصفحة مرة أخرى وأعد الاختبار';}else{icon='🌱';title='تحتاج مراجعة';msg='لا تيأس، المراجعة المستمرة هي المفتاح';}document.getElementById('result-icon').textContent=icon;document.getElementById('result-title').textContent=title;document.getElementById('result-msg').textContent=msg;document.getElementById('progress-fill').style.width='100%';updateBadges();
  try { localStorage.removeItem('quranResume_p5'); } catch(e) {}
  var __rb = document.getElementById('review-mistakes-btn'); if (__rb) __rb.style.display = (wrongIndices.length > 0 ? 'inline-block' : 'none');
  var __pct = Math.round((correctCount/questions.length)*100); if (__pct === 100) spawnConfetti();}
function returnToLevels(){document.getElementById('quiz-area').style.display='none';document.getElementById('level-card').style.display='block';currentLevel=null;document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('active'));document.getElementById('start-btn').classList.remove('ready');document.getElementById('total-q').textContent='-';document.getElementById('wrong-badge').innerHTML='&#x6F0; &#x2717;<br>&#x62E;&#x637;&#x623;';document.getElementById('correct-badge').innerHTML='&#x6F0; &#x2713;<br>&#x635;&#x62D;&#x64A;&#x62D;';document.getElementById('qnum-badge').innerHTML='&#x627;&#x644;&#x633;&#x624;&#x627;&#x644; &#x6F1; /<br>-';document.getElementById('progress-fill').style.width='0%';}
function retryQuiz(){document.getElementById('result-area').style.display='none';document.getElementById('level-card').style.display='block';currentLevel=null;document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('active'));document.getElementById('start-btn').classList.remove('ready');document.getElementById('total-q').textContent='10';document.getElementById('wrong-badge').innerHTML='0 ✗<br>خطأ';document.getElementById('correct-badge').innerHTML='0 ✓<br>صحيح';document.getElementById('qnum-badge').innerHTML='السؤال 1 /<br>10';document.getElementById('progress-fill').style.width='0%';}

function shareApp(){var url='https://quran-darbi.github.io/Quran-test-/';if(navigator.share){navigator.share({title:'دربي لحفظ القرآن',url:url}).catch(function(){});}else{navigator.clipboard.writeText(url).then(function(){var b=document.querySelector('[onclick="shareApp()"]');if(b){b.textContent='✅';setTimeout(function(){b.textContent='🔗';},2000);}}).catch(function(){});}}
function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  document.getElementById('theme-toggle').textContent = mode === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('quranTheme', next); } catch(e) {}
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('quranTheme'); } catch(e) {}
  if (!saved) saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  applyTheme(saved);
})();

function renderDotProgress() {
  const wrap = document.getElementById('dot-progress');
  if (!wrap) return;
  wrap.innerHTML = '';
  if (!statuses || !statuses.length) return;
  statuses.forEach((st, i) => {
    const dot = document.createElement('span');
    dot.className = 'q-dot' + (i === qIndex ? ' current' : st !== 'pending' ? ' ' + st : '');
    wrap.appendChild(dot);
  });
}

function saveResumeState() {
  try {
    localStorage.setItem('quranResume_p5', JSON.stringify({
      level: currentLevel, qIndex, correctCount, wrongCount, statuses, wrongIndices, date: Date.now()
    }));
  } catch(e) {}
}
function dismissResume() {
  try { localStorage.removeItem('quranResume_p5'); } catch(e) {}
  const b = document.getElementById('resume-banner');
  if (b) b.style.display = 'none';
}
function resumeQuiz() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('quranResume_p5')); } catch(e) {}
  if (!saved) return;
  currentLevel = saved.level;
  if (currentLevel === 'easy')   questions = [...EASY_Q];
  if (currentLevel === 'medium') questions = [...MEDIUM_Q];
  if (currentLevel === 'hard')   questions = [...HARD_Q];
  qIndex = saved.qIndex;
  correctCount = saved.correctCount;
  wrongCount = saved.wrongCount;
  statuses = saved.statuses || questions.map(() => 'pending');
  wrongIndices = saved.wrongIndices || [];
  document.getElementById('resume-banner').style.display = 'none';
  document.getElementById('level-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  showQuestion();
}
(function checkResumeOnLoad() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('quranResume_p5')); } catch(e) {}
  if (saved && saved.qIndex > 0) {
    const b = document.getElementById('resume-banner');
    if (b) b.style.display = 'block';
  }
})();

let reviewQuestions = [];
let reviewIdx = 0;
function startReview() {
  reviewQuestions = wrongIndices.map(i => questions[i]);
  reviewIdx = 0;
  if (!reviewQuestions.length) return;
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('review-area').style.display = 'block';
  renderReviewQ();
}
function renderReviewQ() {
  const q = reviewQuestions[reviewIdx];
  document.getElementById('review-number').textContent = `مراجعة ${toArabicNum(reviewIdx + 1)} من ${toArabicNum(reviewQuestions.length)}`;
  document.getElementById('review-q-text').textContent = q.q;
  const answerText = (currentLevel === 'easy') ? q.choices[q.answer] : q.answer;
  document.getElementById('review-answer').textContent = '✓ ' + answerText;
}
function reviewNav(dir) {
  reviewIdx = Math.max(0, Math.min(reviewQuestions.length - 1, reviewIdx + dir));
  renderReviewQ();
}
function endReview() {
  document.getElementById('review-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';
}

function spawnConfetti() {
  const colors = ['#4a7c4a', '#c4a84a', '#9db89d', '#e0edd8', '#7a9a7a'];
  const container = document.getElementById('confetti-container');
  if (!container) return;
  container.innerHTML = '';
  container.style.display = 'block';
  for (let i = 0; i < 45; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    piece.style.animationDelay = (Math.random() * 0.4) + 's';
    container.appendChild(piece);
  }
  setTimeout(() => { container.style.display = 'none'; container.innerHTML = ''; }, 4000);
}

function prevQuestion() {
  if (qIndex === 0) return;
  qIndex--;
  showQuestion();
}
(function enableSwipe() {
  const area = document.getElementById('quiz-area');
  if (!area) return;
  let startX = 0, startY = 0;
  area.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  area.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;
    const nextBtn = document.getElementById('next-btn');
    if (dx < 0 && nextBtn && nextBtn.style.display === 'block') {
      nextQuestion();
    } else if (dx > 0) {
      prevQuestion();
    }
  }, { passive: true });
})();
</script>
